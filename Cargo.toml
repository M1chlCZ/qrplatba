[package]
name = "qrplatba"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Czech QR payment (SPAYD/SPD) string and QR image generator."
repository = "https://github.com/M1chlCZ/qrplatba"
homepage = "https://github.com/M1chlCZ/qrplatba"
readme = "README.md"
keywords = ["qr", "payment", "spayd", "invoice", "czech"]
categories = ["command-line-utilities", "encoding"]

[lib]
name = "qrplatba"
path = "src/lib.rs"

[[bin]]
name = "qrplatba"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
